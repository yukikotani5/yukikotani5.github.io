name: サイトの自動更新

# ① 毎日 朝6時（日本時間）に論文・ポッドキャスト・noteを取り込む
# ② GitHub の Actions タブから手動でも実行できる
# ③ main ブランチに変更を push したときも走る
on:
  schedule:
    - cron: "0 21 * * *"      # UTC 21:00 = JST 翌朝 6:00
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write             # 更新したJSONをコミットするため
  pages: write                # GitHub Pages に公開するため
  id-token: write

# 同時に2つ走ると push が衝突するため、この workflow は1本ずつ順番に流す
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/*.json は毎回作り直せる生成物なので、競合させずに
      # 「常に最新のリモートの上で作り直す」方式にする。
      # （手動 push と定時実行が重なると、リベースでは中身が衝突して解決できない）
      - name: 最新データを取得してコミット
        run: |
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main

            if ! python3 scripts/update.py; then
              echo "::warning::一部のデータ取得に失敗しました。前回の値を保持します。"
              touch /tmp/fetch_failed
            fi

            if [ -z "$(git status --porcelain data/ sitemap.xml)" ]; then
              echo "変更はありませんでした"
              exit 0
            fi

            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ sitemap.xml
            git commit -qm "データ自動更新: $(date -u '+%Y-%m-%d')"

            if git push -q origin main; then
              echo "更新をコミットしました"
              exit 0
            fi

            echo "他の push と競合しました。最新を取り直してやり直します（$attempt/3）"
            sleep 5
          done
          echo "::error::3回試しましたが push できませんでした"
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      # 取得に失敗していたら、ジョブを失敗扱いにして気づけるようにする
      # （サイトは前回データのまま公開されているので、表示は壊れません）
      # 取得に失敗していたらジョブを失敗扱いにして気づけるようにする
      # （サイトは前回のデータで公開され続けるので、表示は壊れません）
      - name: 取得失敗を通知
        run: |
          if [ -f /tmp/fetch_failed ]; then
            echo "::error::一部のデータ取得に失敗しました。サイトは前回のデータで公開されています。"
            exit 1
          fi
          echo "すべて正常に取得できました"
